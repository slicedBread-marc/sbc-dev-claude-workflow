# claude-workflow configuration
#
# If you are Claude and these values are blank or unset:
# Scan the project and fill them in before proceeding with any workflow skill.
# Detection hints are in the comments for each field.
# After filling in values, confirm with the user before writing the file.

# Build command — run to compile/build the project.
# Detect from: package.json "scripts.build", Makefile targets, *.csproj / *.slnx (use "dotnet build <file>"), CMakeLists.txt
build_command: ""

# Test command — run to execute the full test suite.
# Detect from: package.json "scripts.test", jest.config.*, *.csproj / *.slnx (use "dotnet test <file>"), pytest.ini, go.mod
test_command: ""

# Flag to run a single test by name or pattern.
# Common values: "--grep" (mocha/jest), "--filter" (dotnet), "-k" (pytest), "-run" (go)
test_filter_flag: ""

# Filter to exclude e2e tests (used by implement/verify — fast feedback without a running server).
# e.g., '--filter "FullyQualifiedName!~E2E"' (dotnet), '--grep "^(?!.*E2E)"' (mocha)
test_exclude_e2e: ""

# Filter to run only e2e tests (used by wf-test — human tester has the app running).
# e.g., '--filter "FullyQualifiedName~E2E"' (dotnet), '--grep E2E' (mocha)
test_only_e2e: ""

# Source directories — the implementer is allowed to edit files in these paths.
# Detect from: project structure (src/, lib/, app/, tests/, spec/, etc.)
source_dirs:
  - ""

# Namespace or module convention used in this project.
# Detect from: existing source files — look at the top-level namespace/module declarations.
# e.g., "SBC.[Project].[Folder]" for C#, "com.example.[module]" for Java — leave blank if N/A
namespace_convention: ""

# Free-text note about project conventions the reviewer/verifier should know.
# e.g., "Use repository pattern for data access. No direct DbContext in controllers."
conventions_note: ""

# Solution or project file (used in build/test commands if applicable).
# Detect from: *.slnx, *.sln, *.csproj, package.json, pyproject.toml, go.mod in the root
solution_file: ""

# Project slug — short identifier used to namespace Docker compose projects
# (e.g., "sbc-pln004"). Must be unique per client to avoid container collisions
# between projects sharing a Docker daemon.
# Detect from: directory name or repo name (e.g., "sbc" for /Users/marcblais/dev/sbc).
project_slug: ""

# Production deploy references — shown in /wf-deploy completion message.
# Leave blank if the project has no production deployment / CI pipeline.
#   production_logs_url: URL to deploy logs (e.g., GitHub Actions page)
#   production_url:      URL of the live site
production_logs_url: ""
production_url: ""

# Local dev environment — Docker-based auto-start on implement commits (optional).
# If set, a 60-minute idle timer starts on every implement( commit and on manual start.
# The container stops automatically when the timer expires.
# Detect from: docker-compose.yml or docker-compose.yaml in the project root.
#   local_start_command:  start without rebuilding  — e.g. "docker-compose up -d"
#   local_deploy_command: start and rebuild          — e.g. "docker-compose up --build -d"
#   local_stop_command:   stop the environment       — e.g. "docker-compose stop"
# Leave all three blank to skip local env management.
local_start_command: ""
local_deploy_command: ""
local_stop_command: ""

# Tiered test gating (BRF-080).
# wf-verify reads testScopes to build a test-filter expression for feature-branch
# runs; wf-release runs the full suite with no filter (aggregation guarantee).
#
# testScopes — map a category name to a list of test FullyQualifiedName substrings
# (dotnet) or regex fragments (mocha/jest) understood by {{test_filter_flag}}.
# Pick names that describe the change domain, not the test mechanism.
#
# testMappings — when files matching a glob change on the feature branch, the listed
# scopes are added to the verify filter automatically. Planner-declared categories
# (plan.md `## Test Scope`) and testScopeMandatory are always unioned in.
#
# Leave these blocks empty to disable tiered gating — verify falls back to the
# full suite (backward-compatible behavior).
testScopes: {}
#   unit:
#     - MyApp.Core.Tests
#     - MyApp.Web.Tests
#   integration:
#     - MyApp.Web.Tests.AuthTests
#   e2e-smoke:
#     - MyApp.E2E.Tests.HomePageTests
#   e2e-all:
#     - MyApp.E2E.Tests

testMappings: []
#   - glob: "src/Core/**"
#     scopes: [unit]
#   - glob: "src/Web/**"
#     scopes: [unit, integration]
#   - glob: "tests/E2E/**"
#     scopes: [e2e-all]

testScopeMandatory: []
#   - e2e-smoke

# Auto-test growth.
# When enabled, /wf-test offers an [a] choice per criterion: a sonnet agent
# writes (or locates) an automated test, runs it, and commits it to the
# feature branch on pass. The test ships with the PR, so future plans that
# touch the same area get the regression check for free.
#
# Every outcome is appended to logFile (default plans/auto-test-log.md):
#   - ### Realized — agent succeeded. wf-spec reads this during planning to
#     catch criteria that should have been classified automated up front.
#     wf-implement reads it for style reference when writing tests.
#   - ### Candidates — agent couldn't produce a passing test. Manual fallback
#     runs for this criterion; the candidate is reviewed later.
#
# The log is the feedback loop: every [a] you hit is a signal that the plan
# missed an automation opportunity. Reviewing the log informs future specs.
autoTestGrowth:
  # On by default: a criterion checked once by a human is not a regression
  # test, and every criterion converted here runs in every later verify.
  enabled: true
  agentModel: sonnet
  logCandidatesOnFail: true
  logFile: plans/auto-test-log.md

# ── Manual-test gate ────────────────────────────────────────────────────────
# When an unattended /wf-test run stops for a human.
#
# The rule used to be "stop if any `#### Manual` criterion remains". Every plan
# has some, so every plan stopped. But the criteria are not evenly spread: plans
# that render nothing to a human are almost entirely shell assertions wearing a
# manual label, while browser-UI plans are genuinely irreducible. The gate keys
# on the surface the diff touches — which the planner does not control when
# classifying criteria — rather than on how many criteria were written.
#
# A gate opens only when ALL of these hold. `wf-manual-gate.sh` decides;
# /wf-test does not second-guess it.
manualTestGate:
  # 1. The diff must touch a rendering surface below.
  requireRenderingSurface: true

  # 2. At least this many unresolved (eyes:*) criteria must remain.
  minEyesCriteria: 1

  # 3. Whether an (eyes:cosmetic) criterion alone can hold a merge. Off: a
  #    cosmetic failure files a BUG-NNN and the plan ships.
  blockOnCosmetic: false

  # Globs that count as "a human can see this". Empty ⇒ every plan can gate.
  # `/**/` spans any number of directories; a bare `*` stops at a separator.
  renderingSurfaces:
    - "src/**/wwwroot/**"
    - "src/**/*.razor"
    - "src/**/Components/**"
    - "src/**/*.tsx"

# ── Spec approval ───────────────────────────────────────────────────────────
# Who decides a drafted plan may be built.
#
#   gate     every plan parks as a `spec-approval` gate and waits for a human.
#            The default, and the pre-3.0 behavior.
#   verdict  the architecture review runs unattended and its VERDICT is the
#            gate: Approved / Approved-with-notes advances to `ready`, Blocked
#            goes round the fix loop, and only a plan still Blocked after
#            maxReviewRounds parks for a human.
#
# `verdict` exists because the human decision was measured and found empty: in
# one 16-plan program the review found Critical findings in 8 of 8 plans, so the
# question was never "is this good?" but "proceed with the fix loop the reviewer
# just specified" — a state transition wearing a judgment call's clothes. Every
# plan converged in 2 rounds.
#
# Read `docs/orchestrator.md` before switching. In `verdict` mode nothing else
# reads the plan before it is built, so the cross-plan consistency pass is the
# compensating control — leave it on.
specApproval:
  mode: gate

  # Blocked rounds allowed before parking as a `spec-stuck` gate. A plan needing
  # a 4th round has a problem the reviewer cannot articulate, which is exactly
  # when a human is worth interrupting.
  maxReviewRounds: 3

  # Plans carrying any of these tags always gate, whatever the verdict.
  gateTags:
    - security

# ── Orchestrator ────────────────────────────────────────────────────────────
# Dispatches unattended workers by REGISTRY state so the pipeline runs from one
# terminal instead of four. Routing is deterministic bash — only the workers
# cost tokens.
#
#   scripts/wf-exec.sh wf-orchestrate.sh --daemon        continuous
#   scripts/wf-exec.sh wf-orchestrate.sh --sweep         one pass
#   scripts/wf-exec.sh wf-orchestrate.sh PLN-097         drive one plan
#   scripts/wf-exec.sh wf-orchestrate.sh --sweep --dry-run   see the plan first
#
# Genuine judgment calls (spec approval, `#### Manual` criteria, release/deploy)
# never run unattended — they park as gates and wait for /wf-attend.
orchestrator:
  # OFF by default. Run --sweep --dry-run a few times before turning this on:
  # workers run with --dangerously-skip-permissions.
  enabled: false

  # Seconds between daemon sweeps.
  sweep_interval: 60

  # Live workers allowed per role. implement > 1 means concurrent worktrees;
  # keep spec at 1 so two specs can't race on the same brief.
  max_concurrent:
    spec: 1
    implement: 2
    verify: 2
    test: 1
    consistency: 1

  # Model tier per role — the whole point is that grunt work runs cheap.
  # spec gets the expensive model because planning is where judgment lives.
  models:
    spec: opus
    implement: sonnet
    verify: sonnet
    test: haiku
    consistency: sonnet

  # Cross-plan consistency pass. When a plan with declared Deps reaches `ready`,
  # a worker reads it plus its whole dependency closure and checks only the
  # claims BETWEEN plans: consumed APIs exist with the assumed shape, required
  # entities have a provisioning path somewhere, no two plans define the same
  # artifact incompatibly.
  #
  # No other role owns this. Every review is scoped to one plan, so two plans
  # can each be correct alone and still contradict each other — and the same
  # missing-provisioning-path defect appeared in 7 of 16 plans of one program
  # without any per-plan review being able to see it was a pattern.
  #
  # It runs BEFORE implement: caught while both plans are documents it is an
  # amendment; caught after one is built it is a migration. It is also the
  # compensating control for specApproval.mode: verdict — turning that on while
  # turning this off leaves nothing reading across plans at all.
  consistency_pass: true

  # Loop breaker. A plan launched this many times WITHOUT FORWARD PROGRESS
  # parks as a `stuck` gate instead of burning tokens forever.
  #
  # Forward progress = the registry state moved, or progress.md's `## Steps`
  # checklist gained a tick. That distinction is what keeps a clean resume of a
  # long plan from spending the same budget as an active⇄verify thrash — do not
  # raise this to work around a plan that parks mid-build. If that happens, the
  # implementer is not calling wf-progress-tick.sh, and the fix is there.
  max_attempts_per_plan: 3

  # Hard ceiling on worker launches per hour, across all roles. The backstop
  # for a runaway pipeline.
  max_spawns_per_hour: 20
